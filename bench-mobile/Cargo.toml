[package]
name = "bench-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Mobile benchmarks for ProveKit Noir passport proving"

[package.metadata.cargo-machete]
ignored = ["inventory"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow.workspace = true
inventory.workspace = true
mobench-sdk.workspace = true
noirc_abi.workspace = true
noirc_artifacts.workspace = true
provekit-common.workspace = true
provekit-prover = { workspace = true, features = ["witness-generation"] }
provekit-r1cs-compiler.workspace = true
provekit-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "1.0"
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true
