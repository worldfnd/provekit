[workspace]
resolver = "2"
members = [
  # "skyscraper/fp-rounding",
  # "skyscraper/hla",
  # "skyscraper/bn254-multiplier",
  # "skyscraper/bn254-multiplier-codegen",
  # "skyscraper/core",
  "provekit/common",
  "provekit/r1cs-compiler",
  "provekit/prover",
  "provekit/verifier",
  "tooling/cli",
  "tooling/provekit-bench",
  "tooling/provekit-ffi",
  "tooling/provekit-gnark",
  "tooling/verifier-server",
  # "ntt",
]
exclude = ["playground/passport-input-gen"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
authors = [
  "Remco Bloemen <remco@world.org>",
  "Philipp Sippl <philipp@world.org>",
  "Aditya Bisht <aditya@atheon.xyz>",
  "Ashish Kumar <ashish@atheon.xyz>",
  "Rose Jethani <rose@atheon.xyz>",
  "Yashwanth Reddy <yashwanth@atheon.xyz>",
  "Arun Kumar <arun@atheon.xyz>",
  "Yuval Domb",
  "Xander van der Goot",
  "Koh Wei Jie",
  "Tony Wu",
  "Vishruti Ganesh",
  "Benjamin Wilson",
  "Yogesh Swami",
  "Ryan Cao",
  "Shreyas Londhe",
  # TODO: More contributors
]
license = "MIT"
homepage = "https://github.com/worldfnd/ProveKit"
repository = "https://github.com/worldfnd/ProveKit"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
cargo = "warn"
perf = "warn"
complexity = "warn"
style = "warn"
correctness = "warn"
suspicious = "warn"

cargo_common_metadata = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
missing_docs_in_private_items = { level = "allow", priority = 1 }

missing_safety_doc = { level = "deny", priority = 1 }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

# Size-optimized builds for mobile (iOS/Android): cargo build --profile release-mobile
[profile.release-mobile]
inherits = "release"
opt-level = "z"

# Fast release builds for development iteration: cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = "thin"

# Doing light optimizations helps test performance more than it hurts build time.
[profile.test]
opt-level = 2

# Compilation profile for any non-workspace member. We want to optimize these even in debug mode.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Workspace members - Skyscraper
bn254-multiplier = { package = "provekit-bn254-multiplier", version = "0.1.0" }
bn254-multiplier-codegen = { package = "provekit-bn254-multiplier-codegen", version = "0.1.0" }
fp-rounding = { package = "provekit-fp-rounding", version = "0.1.0" }
hla = { package = "provekit-hla", version = "0.1.0" }
skyscraper = { package = "provekit-skyscraper", version = "0.1.0" }
ntt = { package = "provekit-ntt", version = "0.1.0" }

# Workspace members - ProveKit
provekit-bench = { path = "tooling/provekit-bench" }
provekit-cli = { path = "tooling/cli", version = "0.1.2" }
provekit-common = { path = "provekit/common", version = "0.1.3" }
provekit-ffi = { path = "tooling/provekit-ffi" }
provekit-gnark = { path = "tooling/provekit-gnark", version = "0.1.2" }
provekit-prover = { path = "provekit/prover", version = "0.1.3" }
provekit-r1cs-compiler = { path = "provekit/r1cs-compiler", version = "0.1.3" }
provekit-verifier = { path = "provekit/verifier", version = "0.1.3" }
provekit-verifier-server = { path = "tooling/verifier-server" }

# 3rd party
anyhow = "1.0.93"
argh = "0.1.12"
axum = "0.8.4"
base64 = "0.22.1"
bytes = "1.10.1"
ciborium = "0.2.2"
chrono = "0.4.41"
# On CI divan get replaced by divan = { package = "codspeed-divan-compat", version = "3.0.1" } for benchmark tracking.
# This is a workaround because different package selection based on target does not mix well with workspace dependencies.
divan = "0.1.21"
hex = "0.4.3"
itertools = "0.14.0"
paste = "1.0.15"
postcard = { version = "1.1.1", features = ["use-std"] }
primitive-types = "0.13.1"
proptest = "1.6.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
rand = "0.9.1"
rand08 = { package = "rand", version = "0.8" }
rayon = "1.10.0"
reqwest = "0.12.23"
ruint = { version = "1.12.3", features = ["num-traits", "rand"] }
seq-macro = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
test-case = "3.3.1"
tikv-jemallocator = "0.6"
toml = "0.8.8"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.13"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "ansi"] }
tracing-tracy = "=0.11.4"
tracy-client = "=0.18.0"
tracy-client-sys = "=0.24.3"
parking_lot = "0.12"
xz2 = "0.1.7"
zerocopy = "0.8.25"
zeroize = "1.8.1"
zstd = "0.13"

# Noir language dependencies
acir = { package = "provekit_acir", version = "1.0.0-beta.11-alpha.1" }
bn254_blackbox_solver = { package = "provekit_bn254_blackbox_solver", version = "1.0.0-beta.11-alpha.1" }
nargo = { package = "provekit_nargo", version = "1.0.0-beta.11-alpha.4" }
nargo_cli = { package = "provekit_nargo_cli", version = "1.0.0-beta.11-alpha.6" }
nargo_toml = { package = "provekit_nargo_toml", version = "1.0.0-beta.11-alpha.4" }
noir_artifact_cli = { package = "provekit_noir_artifact_cli", version = "1.0.0-beta.11-alpha.4" }
noirc_abi = { package = "provekit_noirc_abi", version = "1.0.0-beta.11-alpha.1" }
noirc_artifacts = { package = "provekit_noirc_artifacts", version = "1.0.0-beta.11-alpha.4" }
noirc_driver = { package = "provekit_noirc_driver", version = "1.0.0-beta.11-alpha.4" }

# Cryptography and proof systems
ark-bn254 = { version = "0.5.0", default-features = false, features = [
  "scalar_field",
] }
ark-crypto-primitives = { version = "0.5", features = ["merkle_tree"] }
ark-ff = { version = "0.5", features = ["asm", "std"] }
ark-poly = "0.5"
ark-serialize = "0.5"
ark-std = { version = "0.5", features = ["std"] }
spongefish = { package = "provekit-spongefish", version = "0.1.0", features = [
  "ark-ff",
  "sha2",
] }
spongefish-pow = { package = "provekit-spongefish-pow", version = "0.1.0" }
whir = { package = "provekit-whir", version = "0.1.1", features = ["tracing"] }
