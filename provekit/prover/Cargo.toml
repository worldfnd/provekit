[package]
name = "provekit-prover"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["witness-generation", "parallel", "bn254"]
# At least one field feature must be enabled; `bn254` takes precedence when
# both are on. Pair `goldilocks` with `--no-default-features`.
# `provekit-verifier/<field>` forwards the field selection to the dev-dep used
# by `goldilocks_fixtures`, so `cargo test -p provekit-prover` builds the verifier
# over the same field as common (it has no field feature of its own otherwise).
bn254 = [
    "provekit-common/bn254",
    "provekit-common/provekit_ntt",
    "provekit-verifier/bn254",
    "dep:mavros-vm",
    "dep:mavros-artifacts",
]
goldilocks = ["provekit-common/goldilocks", "provekit-verifier/goldilocks"]
witness-generation = ["bn254", "nargo", "bn254_blackbox_solver", "noir_artifact_cli"]
parallel = ["provekit-common/parallel"]

[dependencies]
# Workspace crates
provekit-common.workspace = true

# Noir language
acir.workspace = true
noirc_abi.workspace = true

# Cryptography and proof systems
ark-ff.workspace = true
ark-std.workspace = true
whir.workspace = true

# 3rd party
anyhow.workspace = true
num-bigint.workspace = true
postcard.workspace = true
tracing.workspace = true

# Target-specific dependencies: only on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bn254_blackbox_solver = { workspace = true, optional = true }
nargo = { workspace = true, optional = true }
noir_artifact_cli = { workspace = true, optional = true }
mavros-vm = { workspace = true, optional = true }
mavros-artifacts = { workspace = true, optional = true }

[dev-dependencies]
# No default features: the field feature must unify from this crate's own
# `bn254`/`goldilocks` selection, not be forced to bn254 by the dev-dep.
provekit-verifier = { workspace = true, default-features = false }

[lints]
workspace = true
