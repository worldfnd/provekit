[package]
name = "provekit-common"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
parallel = []

[dependencies]
# Cryptography and proof systems
keccak.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
spongefish.workspace = true
whir.workspace = true

# 3rd party
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
num-bigint.workspace = true
postcard.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha3.workspace = true
tracing.workspace = true

# Target-specific dependencies: only on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true
xz2.workspace = true

[package.metadata.cargo-machete]
ignored = ["keccak"] # Intentionally anchored to keep Noir beta.19-compatible RC version

[lints]
workspace = true
