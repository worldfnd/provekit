[package]
name = "provekit-common"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
parallel = []

[dependencies]
# Noir language
acir.workspace = true
noirc_abi.workspace = true

# Cryptography and proof systems
keccak.workspace = true
ark-bn254.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
spongefish.workspace = true
spongefish-pow.workspace = true
whir.workspace = true

# 3rd party
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
hex.workspace = true
itertools.workspace = true
postcard.workspace = true
rayon.workspace = true
ruint.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
sha2.workspace = true
sha3.workspace = true
tracing.workspace = true
zerocopy.workspace = true

# Target-specific dependencies: only on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true
mavros-vm.workspace = true
mavros-artifacts.workspace = true
xz2.workspace = true

[package.metadata.cargo-machete]
ignored = ["keccak"] # Intentionally anchored to keep Noir beta.19-compatible RC version

[dev-dependencies]
divan.workspace = true
# dev-dependency cycle (allowed; excluded from the normal build graph). Needed
# because common's tests/benches use the bn254 provider and NTT.
provekit-field-bn254.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[[bench]]
name = "rs_bench"
harness = false

[lints]
workspace = true
