[package]
name = "provekit-common"
version = "1.0.1"
description = "Common types and utilities for the ProveKit proving system"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# Workspace crates
# skyscraper.workspace = true

# Noir language
acir.workspace = true
noirc_abi.workspace = true

# Cryptography and proof systems
ark-bn254.workspace = true
ark-ff.workspace = true
ark-ff-v06.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
spongefish.workspace = true
spongefish-pow.workspace = true
whir.workspace = true

# 3rd party
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
ciborium.workspace = true
hex.workspace = true
itertools.workspace = true
postcard.workspace = true
rayon.workspace = true
ruint.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
tracing.workspace = true
zerocopy.workspace = true

# Target-specific dependencies: only on non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xz2.workspace = true
zstd.workspace = true

# WASM-only: force getrandom v0.2 `js` feature so transitive rand_core 0.6
# (via k256 → provekit_acvm_blackbox_solver) builds on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[lints]
workspace = true
