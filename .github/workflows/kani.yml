name: Kani model checking

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          # Whitelist the directories that use Kani to prevent it building the entire project.
          working-directory: "./cm31"
