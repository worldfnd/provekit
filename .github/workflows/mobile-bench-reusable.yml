name: Reusable Mobile Benchmark (BrowserStack)

on:
  workflow_call:
    inputs:
      crate_path:
        description: "Path to the benchmark crate in the caller repo"
        required: true
        type: string
      functions:
        description: "Comma-separated or JSON array list of benchmark function names to run"
        required: true
        type: string
      functions_ios:
        description: "Optional iOS-specific benchmark function list"
        required: false
        type: string
        default: ""
      functions_android:
        description: "Optional Android-specific benchmark function list"
        required: false
        type: string
        default: ""
      iterations:
        description: "Number of benchmark iterations"
        required: false
        type: string
        default: "2"
      warmup:
        description: "Number of warmup iterations"
        required: false
        type: string
        default: "1"
      platform:
        description: "Target platform: android, ios, or both"
        required: false
        type: string
        default: "both"
      device_profile:
        description: "Device profile to run (smoke, triad, or worst)"
        required: false
        type: string
        default: "triad"
      device_profile_ios:
        description: "Optional iOS-specific device profile; defaults to device_profile"
        required: false
        type: string
        default: ""
      device_profile_android:
        description: "Optional Android-specific device profile; defaults to device_profile"
        required: false
        type: string
        default: ""
      rust_targets_ios:
        description: "Comma-separated iOS Rust targets"
        required: false
        type: string
        default: "aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios"
      rust_targets_android:
        description: "Comma-separated Android Rust targets"
        required: false
        type: string
        default: "aarch64-linux-android"
      build_release:
        description: "Build in release mode"
        required: false
        type: boolean
        default: true
      mobench_version:
        description: "Mobench version to install"
        required: false
        type: string
        default: "0.1.43"
      mobench_ref:
        description: "Optional Git ref for mobile-bench-rs to override the released mobench install"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number for reporting"
        required: false
        type: string
      report_repository:
        description: "owner/repo to receive the sticky benchmark comment; defaults to the workflow repository"
        required: false
        type: string
        default: ""
      requested_by:
        description: "Who triggered the run"
        required: false
        type: string
      head_sha:
        description: "Exact commit SHA to checkout in the caller repo"
        required: false
        type: string
    secrets:
      BROWSERSTACK_USERNAME:
        required: false
      BROWSERSTACK_ACCESS_KEY:
        required: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-03-04

jobs:
  ios:
    name: iOS BrowserStack benchmark
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    environment: Browserstack
    concurrency:
      group: mobench-browserstack-device-cloud
      cancel-in-progress: false
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      IOS_DEPLOYMENT_TARGET: "10.0"
      IPHONEOS_DEPLOYMENT_TARGET: "10.0"
      CFLAGS_aarch64_apple_ios: "-miphoneos-version-min=10.0"
      CFLAGS_aarch64_apple_ios_sim: "-mios-simulator-version-min=10.0"
      CFLAGS_x86_64_apple_ios: "-mios-simulator-version-min=10.0"
      CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS: "-C link-arg=-miphoneos-version-min=10.0"
      CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUSTFLAGS: "-C link-arg=-mios-simulator-version-min=10.0"
      CARGO_TARGET_X86_64_APPLE_IOS_RUSTFLAGS: "-C link-arg=-mios-simulator-version-min=10.0"
      MOBENCH_ALLOW_UNSUPPORTED_IOS_DEPLOYMENT_TARGET: "1"
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          path: caller
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Resolve iOS device profile
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile_ios != '' && inputs.device_profile_ios || inputs.device_profile }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          case "${DEVICE_PROFILE}" in
            smoke)
              device_specs="iPhone SE 2022-15"
              fallback_device_specs="iPhone SE 2022-15"
              fetch_timeout_secs="7200"
              ;;
            worst)
              device_specs="iPhone SE 2022-15"
              fallback_device_specs="iPhone SE 2022-15"
              fetch_timeout_secs="7200"
              ;;
            triad)
              device_specs="iPhone SE 2022-15,iPhone 14-16,iPhone 16 Pro Max-18"
              fallback_device_specs="iPhone SE 2022-15,iPhone 14-16,iPhone 16 Pro Max-18"
              fetch_timeout_secs="7200"
              ;;
            *)
              echo "::error::Unsupported device_profile '${DEVICE_PROFILE}'. Supported values: smoke, triad, worst."
              exit 1
              ;;
          esac
          if [[ "${ITERATIONS}" =~ ^[0-9]+$ ]] && [ "${ITERATIONS}" -ge 100 ]; then
            fetch_timeout_secs="21600"
          fi

          {
            echo "MOBENCH_DEVICE_PROFILE=${DEVICE_PROFILE}"
            echo "IOS_DEVICE_SPECS=${device_specs}"
            echo "IOS_FALLBACK_DEVICE_SPECS=${fallback_device_specs}"
            echo "MOBENCH_FETCH_TIMEOUT_SECS=${fetch_timeout_secs}"
          } >> "$GITHUB_ENV"

          echo "Resolved iOS device profile '${DEVICE_PROFILE}' to ${device_specs}"
          echo "Resolved iOS fallback devices to ${fallback_device_specs}"
          echo "Resolved iOS fetch timeout to ${fetch_timeout_secs}s"

      - name: Setup Rust
        shell: bash
        env:
          RUST_TARGETS: ${{ inputs.rust_targets_ios }}
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

          IFS=',' read -r -a rust_targets <<<"${RUST_TARGETS}"
          for target in "${rust_targets[@]}"; do
            target="$(echo "$target" | xargs)"
            if [[ -n "$target" ]]; then
              rustup target add "$target" --toolchain "${RUST_TOOLCHAIN}"
            fi
          done

          rustc -Vv
          cargo -V

      - name: Install mobench
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${MOBENCH_REF}" ]]; then
            echo "Installing mobench from ${MOBENCH_REF}"
            git clone https://github.com/worldcoin/mobile-bench-rs mobench-src
            git -C mobench-src fetch --depth 1 origin "${MOBENCH_REF}"
            git -C mobench-src checkout FETCH_HEAD
            cargo install --path mobench-src/crates/mobench --locked --force
          else
            echo "Installing mobench ${MOBENCH_VERSION} from crates.io"
            cargo install mobench --version "${MOBENCH_VERSION}" --locked --force
          fi
          cargo-mobench --version

      - name: Setup Noir
        uses: noir-lang/noirup@v0.1.2
        with:
          toolchain: v1.0.0-beta.19

      - name: Verify Noir
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.nargo/bin:${PATH}"
          echo "${HOME}/.nargo/bin" >> "$GITHUB_PATH"

          actions_root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_actions"
          noirup_bin="$(find "${actions_root}/noir-lang/noirup" -type f -name noirup 2>/dev/null | sort | tail -1 || true)"

          for attempt in 1 2 3; do
            if command -v nargo >/dev/null 2>&1; then
              nargo --version
              exit 0
            fi

            if [[ -z "${noirup_bin}" ]]; then
              echo "::error::noirup action binary was not found under ${actions_root}"
              exit 1
            fi

            echo "::warning::nargo was not installed by noirup; retrying Noir install (${attempt}/3)"
            rm -f "${HOME}/.nargo/bin/nargo" "${HOME}/.nargo/bin/bb" || true
            "${noirup_bin}" --version v1.0.0-beta.11 || true
            sleep $((attempt * 5))
          done

          echo "::error::nargo is still unavailable after retrying noirup"
          ls -la "${HOME}/.nargo/bin" || true
          exit 1

      - name: Install iOS tooling
        run: brew install xcodegen swiftformat

      - name: Generate mobile benchmark Noir artifacts
        working-directory: caller
        run: bench-mobile/scripts/generate-fixtures.sh

      - name: Build iOS artifacts
        working-directory: caller
        shell: bash
        env:
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
          PROVEKIT_REQUIRE_MOBILE_BENCH_ARTIFACTS: "1"
        run: |
          set -euo pipefail
          echo "Building iOS artifacts for profile ${MOBENCH_DEVICE_PROFILE}"
          cargo-mobench build \
            --target ios \
            $RELEASE_FLAG \
            --crate-path "$CRATE_PATH" \
            --ios-deployment-target "${IOS_DEPLOYMENT_TARGET}" \
            --ios-runner uikit-legacy

          cargo-mobench package-ipa --method adhoc --crate-path "$CRATE_PATH"
          cargo-mobench package-xcuitest --crate-path "$CRATE_PATH"
          test -f target/mobench/ios/BenchRunner.ipa
          test -f target/mobench/ios/BenchRunnerUITests.zip

      - name: Run iOS benchmarks
        id: run_ios_benchmarks
        timeout-minutes: 720
        working-directory: caller
        shell: bash
        env:
          FUNCTIONS: ${{ inputs.functions_ios != '' && inputs.functions_ios || inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
          PROVEKIT_REQUIRE_MOBILE_BENCH_ARTIFACTS: "1"
        run: |
          set -euo pipefail

          benchmark_functions=()
          if [[ "${FUNCTIONS}" == \[* ]]; then
            while IFS= read -r function_name; do
              if [[ -n "${function_name}" ]]; then
                benchmark_functions+=("${function_name}")
              fi
            done < <(jq -r '.[]' <<<"${FUNCTIONS}")
          else
            IFS=',' read -r -a raw_functions <<<"${FUNCTIONS}"
            for function_name in "${raw_functions[@]}"; do
              function_name="$(echo "$function_name" | xargs)"
              if [[ -n "${function_name}" ]]; then
                benchmark_functions+=("${function_name}")
              fi
            done
          fi

          if [ "${#benchmark_functions[@]}" -eq 0 ]; then
            echo "::error::No iOS benchmark functions resolved from '${FUNCTIONS}'"
            exit 1
          fi

          echo "Running iOS benchmarks with profile ${MOBENCH_DEVICE_PROFILE}"
          echo "iOS devices: ${IOS_DEVICE_SPECS}"
          echo "iOS fallback devices: ${IOS_FALLBACK_DEVICE_SPECS}"
          echo "iOS fetch timeout: ${MOBENCH_FETCH_TIMEOUT_SECS}s"
          max_attempts=2
          if [[ "${ITERATIONS}" =~ ^[0-9]+$ ]] && [ "${ITERATIONS}" -ge 100 ]; then
            max_attempts=1
          fi
          retry_sleep_secs=120
          log_dir="target/mobench/retry-logs/ios"
          mkdir -p "$log_dir"
          rm -rf target/mobench/ci/ios target/browserstack/ios

          is_transient_fetch_failure() {
            local attempt_log="$1"
            local json_path

            if grep -Eiq 'BrowserStack API .*status 5[0-9]{2}|This website is under heavy load|fetch did not recover any benchmark payloads|Timeout waiting for build .* to complete|operation timed out|Request timeout' "$attempt_log"; then
              return 0
            fi

            while IFS= read -r -d '' json_path; do
              if jq -e '
                if (has("status") and ((.status | ascii_downcase) == "running")) then
                  true
                elif (.testcases?.status?.running // 0) > 0 then
                  true
                else
                  false
                end
              ' "$json_path" >/dev/null 2>&1; then
                return 0
              fi
            done < <(find target/browserstack/ios -type f \( -name build.json -o -name session.json \) -print0 2>/dev/null)

            return 1
          }

          is_ios_min_os_schedule_failure() {
            local attempt_log="$1"
            grep -Eq 'os version lower than the minimum required os version|BROWSERSTACK_NO_DEVICE_FOUND_WITH_REQUESTED_CRITERIA|Device not found' "$attempt_log"
          }

          ios_devices=()
          IFS=',' read -r -a raw_ios_devices <<<"${IOS_DEVICE_SPECS}"
          for ios_device in "${raw_ios_devices[@]}"; do
            ios_device="$(echo "$ios_device" | xargs)"
            if [[ -n "$ios_device" ]]; then
              ios_devices+=("${ios_device}")
            fi
          done
          if [ "${#ios_devices[@]}" -eq 0 ]; then
            echo "::error::No iOS devices resolved from '${IOS_DEVICE_SPECS}'"
            exit 1
          fi

          for benchmark_function in "${benchmark_functions[@]}"; do
            function_iterations="${ITERATIONS}"
            function_warmup="${WARMUP}"

            function_slug="$(tr -c '[:alnum:]' '_' <<<"${benchmark_function}" | sed 's/_*$//')"
            for ios_device in "${ios_devices[@]}"; do
              device_slug="$(tr -c '[:alnum:]' '_' <<<"${ios_device}" | sed 's/_*$//')"
              split_ios_samples="false"
              if [[ "${function_iterations}" =~ ^[0-9]+$ ]] && [ "${function_iterations}" -ge 100 ]; then
                split_ios_samples="true"
              fi

              if [[ "${split_ios_samples}" == "true" ]]; then
                result_output_dir="target/mobench/ci/ios/${function_slug}/${device_slug}"
                split_output_dir="${result_output_dir}/split"
                warmup_output_base="target/mobench/split-warmup/ios/${function_slug}/${device_slug}"
                rm -rf "${result_output_dir}" "target/browserstack/ios/${function_slug}/${device_slug}" "${warmup_output_base}" "target/browserstack/ios-warmup/${function_slug}/${device_slug}"
                mkdir -p "${split_output_dir}" "${warmup_output_base}"
                split_failed="false"
                ios_split_batch_size=20
                ios_split_fetch_timeout_secs=7200

                run_ios_split_invocation() {
                  local kind="$1"
                  local index="$2"
                  local iterations="$3"
                  local warmup="$4"
                  local output_dir="$5"
                  local fetch_output_dir="$6"
                  local split_max_attempts="1"
                  local attempt status log_path build_id

                  for ((attempt = 1; attempt <= split_max_attempts; attempt++)); do
                    log_path="${log_dir}/${function_slug}-${device_slug}-${kind}-${index}-attempt-${attempt}.log"
                    rm -rf "${output_dir}" "${fetch_output_dir}"
                    mkdir -p "${output_dir}" "${fetch_output_dir}"

                    echo "mobench ios split ${kind} ${index} attempt ${attempt}/${split_max_attempts}: ${benchmark_function} on ${ios_device} (${iterations} iterations, ${warmup} warmup)"
                    set +e
                    cargo-mobench ci run \
                      --target ios \
                      --function "${benchmark_function}" \
                      --iterations "${iterations}" \
                      --warmup "${warmup}" \
                      --devices "${ios_device}" \
                      --crate-path "$CRATE_PATH" \
                      $RELEASE_FLAG \
                      --ios-deployment-target "${IOS_DEPLOYMENT_TARGET}" \
                      --ios-runner uikit-legacy \
                      --fetch \
                      --fetch-timeout-secs "${ios_split_fetch_timeout_secs}" \
                      --fetch-output-dir "${fetch_output_dir}" \
                      --output-dir "${output_dir}" \
                      2>&1 | tee "$log_path"
                    status=${PIPESTATUS[0]}
                    set -e
                    cp "$log_path" "${output_dir}/attempt-${attempt}.log"
                    if [ "$status" -eq 0 ]; then
                      return 0
                    fi
                    if is_ios_min_os_schedule_failure "$log_path"; then
                      echo "::error::iOS device ${ios_device} requires a newer app/test-suite target in BrowserStack or is unavailable."
                      return "$status"
                    fi
                    if [ "$attempt" -ge "$split_max_attempts" ] || ! is_transient_fetch_failure "$log_path"; then
                      return "$status"
                    fi
                    build_id="$(grep -Eo 'Build ID: [a-f0-9]+' "$log_path" | awk '{print $3}' | tail -1 || true)"
                    if [[ -n "$build_id" ]]; then
                      echo "::warning::Transient BrowserStack fetch failure for split iOS build ${build_id}; retrying ${benchmark_function} on ${ios_device} (${kind} ${index}, attempt ${attempt}/${split_max_attempts})"
                    else
                      echo "::warning::Transient BrowserStack fetch failure for split iOS benchmark; retrying ${benchmark_function} on ${ios_device} (${kind} ${index}, attempt ${attempt}/${split_max_attempts})"
                    fi
                    sleep $((attempt * 15))
                  done
                }

                batch_count=$(((function_iterations + ios_split_batch_size - 1) / ios_split_batch_size))
                for ((batch_index = 1; batch_index <= batch_count; batch_index++)); do
                  sample_start=$(((batch_index - 1) * ios_split_batch_size + 1))
                  remaining=$((function_iterations - sample_start + 1))
                  batch_iterations="${ios_split_batch_size}"
                  if [ "${remaining}" -lt "${batch_iterations}" ]; then
                    batch_iterations="${remaining}"
                  fi
                  batch_warmup=0
                  if [ "${batch_index}" -eq 1 ]; then
                    batch_warmup="${function_warmup}"
                  fi

                  if ! run_ios_split_invocation "sample" "${batch_index}" "${batch_iterations}" "${batch_warmup}" "${split_output_dir}/sample-${batch_index}" "target/browserstack/ios/${function_slug}/${device_slug}/sample-${batch_index}"; then
                    split_failed="true"
                    break
                  fi
                done

                if [[ "${split_failed}" == "true" ]]; then
                  exit 1
                fi

              cargo-mobench ci merge-split-runs \
                --samples-dir "${split_output_dir}" \
                --output-dir "${result_output_dir}" \
                --function "${benchmark_function}" \
                --device "${ios_device}" \
                --iterations "${function_iterations}" \
                --warmup "${function_warmup}"

                continue
              fi

              attempt=1
              while true; do
                attempt_log="${log_dir}/${function_slug}-${device_slug}-attempt-${attempt}.log"
                fetch_output_dir="target/browserstack/ios/${function_slug}/${device_slug}"
                result_output_dir="target/mobench/ci/ios/${function_slug}/${device_slug}"
                rm -rf "${fetch_output_dir}"
                mkdir -p "${fetch_output_dir}" "${result_output_dir}"

                echo "mobench ios ${benchmark_function} attempt ${attempt}/${max_attempts} on ${ios_device}"
                set +e
                  cargo-mobench ci run \
                    --target ios \
                    --function "${benchmark_function}" \
                  --iterations "${function_iterations}" \
                  --warmup "${function_warmup}" \
                  --devices "${ios_device}" \
                    --crate-path "$CRATE_PATH" \
                    $RELEASE_FLAG \
                    --ios-deployment-target "${IOS_DEPLOYMENT_TARGET}" \
                    --ios-runner uikit-legacy \
                    --fetch \
                  --fetch-timeout-secs "${MOBENCH_FETCH_TIMEOUT_SECS}" \
                  --fetch-output-dir "${fetch_output_dir}" \
                  --output-dir "${result_output_dir}" \
                  2>&1 | tee "$attempt_log"
                status=${PIPESTATUS[0]}
                set -e
                cp "$attempt_log" "${result_output_dir}/attempt-${attempt}.log"

                if [ "$status" -eq 0 ]; then
                  break
                fi

                if is_ios_min_os_schedule_failure "$attempt_log"; then
                  echo "::error::iOS device ${ios_device} requires a newer app/test-suite target in BrowserStack or is unavailable."
                  exit "$status"
                fi

                if [ "$attempt" -ge "$max_attempts" ] || ! is_transient_fetch_failure "$attempt_log"; then
                  exit "$status"
                fi

                build_id="$(grep -Eo 'Build ID: [a-f0-9]+' "$attempt_log" | awk '{print $3}' | tail -1 || true)"
                if [[ -n "$build_id" ]]; then
                  echo "::warning::Transient BrowserStack fetch failure for iOS build ${build_id}; retrying ${benchmark_function} on ${ios_device}"
                else
                  echo "::warning::Transient BrowserStack fetch failure for iOS; retrying ${benchmark_function} on ${ios_device}"
                fi

                attempt=$((attempt + 1))
                sleep "$retry_sleep_secs"
              done
            done
          done

      - name: Upload iOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobench-results-ios
          path: |
            caller/target/mobench/ci/ios/**
            caller/target/browserstack/ios/**
            caller/target/browserstack/ios-warmup/**
            caller/target/mobench/retry-logs/ios/**
            caller/target/mobench/split-warmup/ios/**
          if-no-files-found: warn

  android:
    name: Android BrowserStack benchmark
    needs: ios
    if: always() && (inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: macos-14
    timeout-minutes: 360
    environment: Browserstack
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          path: caller
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Resolve Android device profile
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile_android != '' && inputs.device_profile_android || inputs.device_profile }}
        run: |
          set -euo pipefail
          case "${DEVICE_PROFILE}" in
            smoke)
              device_specs="Samsung Galaxy M32-11.0"
              fetch_timeout_secs="900"
              ;;
            worst)
              device_specs="Samsung Galaxy M32-11.0"
              fetch_timeout_secs="900"
              ;;
            triad)
              device_specs="Samsung Galaxy S24-14.0,Google Pixel 7-13.0,Samsung Galaxy M32-11.0"
              fetch_timeout_secs="900"
              ;;
            *)
              echo "::error::Unsupported device_profile '${DEVICE_PROFILE}'. Supported values: smoke, triad, worst."
              exit 1
              ;;
          esac

          {
            echo "MOBENCH_DEVICE_PROFILE=${DEVICE_PROFILE}"
            echo "ANDROID_DEVICE_SPECS=${device_specs}"
            echo "MOBENCH_FETCH_TIMEOUT_SECS=${fetch_timeout_secs}"
          } >> "$GITHUB_ENV"

          echo "Resolved Android device profile '${DEVICE_PROFILE}' to ${device_specs}"
          echo "Resolved Android fetch timeout to ${fetch_timeout_secs}s"

      - name: Setup Rust
        shell: bash
        env:
          RUST_TARGETS: ${{ inputs.rust_targets_android }}
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

          IFS=',' read -r -a rust_targets <<<"${RUST_TARGETS}"
          for target in "${rust_targets[@]}"; do
            target="$(echo "$target" | xargs)"
            if [[ -n "$target" ]]; then
              rustup target add "$target" --toolchain "${RUST_TOOLCHAIN}"
            fi
          done

          rustc -Vv
          cargo -V

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and resolve NDK
        shell: bash
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR=$(command -v sdkmanager 2>/dev/null || echo "sdkmanager")
          fi

          $SDKMGR --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 || true

          if [ -d "${ANDROID_HOME}/ndk/26.1.10909125" ]; then
            NDK_DIR="${ANDROID_HOME}/ndk/26.1.10909125"
          else
            NDK_VER=$(ls "${ANDROID_HOME}/ndk/" 2>/dev/null | sort -V | tail -1)
            if [ -z "$NDK_VER" ]; then
              echo "::error::No Android NDK found"
              exit 1
            fi
            NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VER}"
          fi

          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install mobench
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${MOBENCH_REF}" ]]; then
            echo "Installing mobench from ${MOBENCH_REF}"
            git clone https://github.com/worldcoin/mobile-bench-rs mobench-src
            git -C mobench-src fetch --depth 1 origin "${MOBENCH_REF}"
            git -C mobench-src checkout FETCH_HEAD
            cargo install --path mobench-src/crates/mobench --locked --force
          else
            echo "Installing mobench ${MOBENCH_VERSION} from crates.io"
            cargo install mobench --version "${MOBENCH_VERSION}" --locked --force
          fi
          cargo-mobench --version

      - name: Setup Noir
        uses: noir-lang/noirup@v0.1.2
        with:
          toolchain: v1.0.0-beta.19

      - name: Verify Noir
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.nargo/bin:${PATH}"
          echo "${HOME}/.nargo/bin" >> "$GITHUB_PATH"

          actions_root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_actions"
          noirup_bin="$(find "${actions_root}/noir-lang/noirup" -type f -name noirup 2>/dev/null | sort | tail -1 || true)"

          for attempt in 1 2 3; do
            if command -v nargo >/dev/null 2>&1; then
              nargo --version
              exit 0
            fi

            if [[ -z "${noirup_bin}" ]]; then
              echo "::error::noirup action binary was not found under ${actions_root}"
              exit 1
            fi

            echo "::warning::nargo was not installed by noirup; retrying Noir install (${attempt}/3)"
            rm -f "${HOME}/.nargo/bin/nargo" "${HOME}/.nargo/bin/bb" || true
            "${noirup_bin}" --version v1.0.0-beta.11 || true
            sleep $((attempt * 5))
          done

          echo "::error::nargo is still unavailable after retrying noirup"
          ls -la "${HOME}/.nargo/bin" || true
          exit 1

      - name: Generate mobile benchmark Noir artifacts
        working-directory: caller
        run: bench-mobile/scripts/generate-fixtures.sh

      - name: Build Android artifacts
        working-directory: caller
        shell: bash
        env:
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
          MOBENCH_ANDROID_BENCHMARK_TIMEOUT_SECS: "600"
          MOBENCH_ANDROID_HEARTBEAT_INTERVAL_SECS: "10"
          PROVEKIT_REQUIRE_MOBILE_BENCH_ARTIFACTS: "1"
        run: |
          set -euo pipefail

          is_transient_android_build_failure() {
            local log_path="$1"
            grep -Eiq 'dl\.google\.com|services\.gradle\.org|Could not GET|nodename nor servname provided|Temporary failure in name resolution|Read timed out|Connection reset|Could not resolve com\.android\.tools\.build:aapt2' "$log_path"
          }

          for attempt in 1 2 3; do
            log_path="target/mobench/android-build-attempt-${attempt}.log"
            mkdir -p "$(dirname "$log_path")"
            echo "Android build attempt ${attempt}/3"

            set +e
            cargo-mobench build --target android $RELEASE_FLAG --crate-path "$CRATE_PATH" 2>&1 | tee "$log_path"
            status="${PIPESTATUS[0]}"
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -ge 3 ] || ! is_transient_android_build_failure "$log_path"; then
              exit "$status"
            fi

            echo "::warning::Transient Android/Gradle build dependency fetch failure; retrying after backoff"
            sleep $((attempt * 15))
          done

      - name: Run Android benchmarks
        id: run_android_benchmarks
        timeout-minutes: 300
        working-directory: caller
        shell: bash
        env:
          FUNCTIONS: ${{ inputs.functions_android != '' && inputs.functions_android || inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
          CRATE_PATH: ${{ inputs.crate_path }}
          PROVEKIT_REQUIRE_MOBILE_BENCH_ARTIFACTS: "1"
        run: |
          set -euo pipefail

          benchmark_functions=()
          if [[ "${FUNCTIONS}" == \[* ]]; then
            while IFS= read -r function_name; do
              if [[ -n "${function_name}" ]]; then
                benchmark_functions+=("${function_name}")
              fi
            done < <(jq -r '.[]' <<<"${FUNCTIONS}")
          else
            IFS=',' read -r -a raw_functions <<<"${FUNCTIONS}"
            for function_name in "${raw_functions[@]}"; do
              function_name="$(echo "$function_name" | xargs)"
              if [[ -n "${function_name}" ]]; then
                benchmark_functions+=("${function_name}")
              fi
            done
          fi

          if [ "${#benchmark_functions[@]}" -eq 0 ]; then
            echo "::error::No Android benchmark functions resolved from '${FUNCTIONS}'"
            exit 1
          fi

          echo "Running Android benchmarks with profile ${MOBENCH_DEVICE_PROFILE}"
          echo "Android devices: ${ANDROID_DEVICE_SPECS}"
          echo "Android fetch timeout: ${MOBENCH_FETCH_TIMEOUT_SECS}s"
          max_attempts=1
          retry_sleep_secs=120
          log_dir="target/mobench/retry-logs/android"
          mkdir -p "$log_dir"
          rm -rf target/mobench/ci/android target/browserstack/android
          failure_count=0

          is_transient_fetch_failure() {
            local attempt_log="$1"
            local json_path

            if grep -Eiq 'BrowserStack API .*status 5[0-9]{2}|requesting BrowserStack API|This website is under heavy load|fetch did not recover any benchmark payloads|No benchmark results found|Timeout waiting for build .* to complete|operation timed out|Request timeout' "$attempt_log"; then
              return 0
            fi

            while IFS= read -r -d '' json_path; do
              if jq -e '
                if (has("status") and ((.status | ascii_downcase) == "running")) then
                  true
                elif (.testcases?.status?.running // 0) > 0 then
                  true
                else
                  false
                end
              ' "$json_path" >/dev/null 2>&1; then
                return 0
              fi
            done < <(find target/browserstack/android -type f \( -name build.json -o -name session.json \) -print0 2>/dev/null)

            return 1
          }

          android_devices=()
          IFS=',' read -r -a device_specs <<<"${ANDROID_DEVICE_SPECS}"
          for device in "${device_specs[@]}"; do
            device="$(echo "$device" | xargs)"
            if [[ -n "$device" ]]; then
              android_devices+=("$device")
            fi
          done

          if [ "${#android_devices[@]}" -eq 0 ]; then
            echo "::error::No Android devices resolved from '${ANDROID_DEVICE_SPECS}'"
            exit 1
          fi

          write_android_failure() {
            local result_output_dir="$1"
            local attempt_log="$2"
            local fetch_output_dir="$3"
            local benchmark_function="$4"
            local android_device="$5"
            local function_iterations="$6"
            local function_warmup="$7"
            local function_max_attempts="$8"
            local function_fetch_timeout_secs="$9"

            mkdir -p "${result_output_dir}"
            local build_id
            local waited_secs
            local kill_evidence
            local failure_reason

            build_id="$(grep -Eo 'Build ID: [a-f0-9]+' "$attempt_log" | awk '{print $3}' | tail -1 || true)"
            waited_secs="$(grep -Eo 'waited [0-9]+ seconds' "$attempt_log" | awk '{print $2}' | tail -1 || true)"
            if [[ -z "${waited_secs}" ]]; then
              waited_secs="${function_fetch_timeout_secs}"
            fi
            kill_evidence="$(
              {
                grep -Eih 'lowmemorykiller|low memory|Process .* was killed|Process .* killed|oom_reaper|SIGKILL|signal [0-9]+|out of memory|lmk' "$attempt_log" 2>/dev/null || true
                find "${fetch_output_dir}" -type f -name '*.log' -exec grep -Eih 'lowmemorykiller|low memory|Process .* was killed|Process .* killed|oom_reaper|SIGKILL|signal [0-9]+|out of memory|lmk' {} + 2>/dev/null || true
              } | tail -5 | tr '\n' ' '
            )"
            if [[ -n "${kill_evidence}" ]]; then
              failure_reason="Android benchmark process reported an abnormal kill before results were fetched after ${waited_secs}s: ${kill_evidence}"
            else
              failure_reason="Android benchmark process produced no summary.json before the ${waited_secs}s BrowserStack fetch timeout; likely app/process death or watchdog timeout. Check BrowserStack build logs for LMK/OOM/SIGKILL evidence."
            fi
            {
              echo "### Android fixture incomplete"
              echo ""
              echo "- Function: \`${benchmark_function}\`"
              echo "- Device: \`${android_device}\`"
              echo "- Iterations/Warmup: \`${function_iterations} / ${function_warmup}\`"
              echo "- Fetch timeout: \`${waited_secs}s\`"
              if [[ -n "${build_id}" ]]; then
                echo "- BrowserStack build: \`${build_id}\`"
              fi
              echo "- Reason: ${failure_reason}"
            } > "${result_output_dir}/failure.md"
            jq -n \
              --arg platform "android" \
              --arg function "${benchmark_function}" \
              --arg devices "${android_device}" \
              --arg attempts "${function_max_attempts}" \
              --arg fetch_timeout_secs "${waited_secs}" \
              --arg build_id "${build_id}" \
              --arg reason "${failure_reason}" \
              --arg kill_evidence "${kill_evidence}" \
              '{
                platform: $platform,
                function: $function,
                devices: $devices,
                attempts: ($attempts | tonumber),
                fetch_timeout_secs: ($fetch_timeout_secs | tonumber),
                build_id: (if $build_id == "" then null else $build_id end),
                reason: $reason,
                kill_evidence: (if $kill_evidence == "" then null else $kill_evidence end)
              }' \
              > "${result_output_dir}/failure.json"
          }

          for benchmark_function in "${benchmark_functions[@]}"; do
            ordered_android_devices=("${android_devices[@]}")
            if [[ "${benchmark_function}" == "bench_mobile::bench_passport_complete_age_check_prove" ]]; then
              ordered_android_devices=()
              declare -a deferred_android_devices=()
              for android_device in "${android_devices[@]}"; do
                if [[ "${android_device}" == "Samsung Galaxy M32-11.0" ]]; then
                  deferred_android_devices+=("${android_device}")
                else
                  ordered_android_devices+=("${android_device}")
                fi
              done
              if [ "${#deferred_android_devices[@]}" -gt 0 ]; then
                ordered_android_devices+=("${deferred_android_devices[@]}")
              fi
            fi

            for android_device in "${ordered_android_devices[@]}"; do
              function_iterations="${ITERATIONS}"
              function_warmup="${WARMUP}"
              function_fetch_timeout_secs="${MOBENCH_FETCH_TIMEOUT_SECS}"
              function_max_attempts="${max_attempts}"
              function_android_timeout_secs="900"
              if [[ "${benchmark_function}" == "bench_mobile::bench_passport_complete_age_check_prove" ]]; then
                function_fetch_timeout_secs="1800"
                function_android_timeout_secs="1800"
                function_max_attempts="1"
              fi
              if [[ "${android_device}" == "Samsung Galaxy M32-11.0" && ( "${benchmark_function}" == "bench_mobile::bench_passport_complete_age_check_prove" || "${benchmark_function}" == "bench_mobile::bench_passport_fragmented_age_check_prove" ) ]]; then
                function_fetch_timeout_secs="1800"
                function_android_timeout_secs="1800"
                function_max_attempts="1"
              fi
              if [[ "${benchmark_function}" == "bench_mobile::bench_oprf_prove" ]]; then
                function_max_attempts="2"
              fi
              if [[ "${function_iterations}" =~ ^[0-9]+$ ]] && [ "${function_iterations}" -ge 100 ]; then
                function_fetch_timeout_secs="6000"
                function_android_timeout_secs="6000"
                function_max_attempts="1"
              fi

              function_slug="$(tr -c '[:alnum:]' '_' <<<"${benchmark_function}" | sed 's/_*$//')"
              device_slug="$(tr -c '[:alnum:]' '_' <<<"${android_device}" | sed 's/_*$//')"
              split_low_tier_age_samples="false"
              if [[ "${android_device}" == "Samsung Galaxy M32-11.0" && ( "${benchmark_function}" == "bench_mobile::bench_passport_complete_age_check_prove" || "${benchmark_function}" == "bench_mobile::bench_passport_fragmented_age_check_prove" ) ]]; then
                split_low_tier_age_samples="true"
              fi
              if [[ "${android_device}" == "Google Pixel 7-13.0" && "${benchmark_function}" == "bench_mobile::bench_passport_complete_age_check_prove" ]]; then
                split_low_tier_age_samples="true"
              fi

              if [[ "${split_low_tier_age_samples}" == "true" ]]; then
                result_output_dir="target/mobench/ci/android/${function_slug}/${device_slug}"
                split_output_dir="${result_output_dir}/split"
                warmup_output_base="target/mobench/split-warmup/android/${function_slug}/${device_slug}"
                rm -rf "${result_output_dir}" "target/browserstack/android/${function_slug}/${device_slug}" "${warmup_output_base}" "target/browserstack/android-warmup/${function_slug}/${device_slug}"
                mkdir -p "${split_output_dir}" "${warmup_output_base}"
                split_failed="false"

                run_split_invocation() {
                  local kind="$1"
                  local index="$2"
                  local output_dir="$3"
                  local fetch_output_dir="$4"
                  local split_max_attempts="2"
                  local attempt status log_path build_id

                  for ((attempt = 1; attempt <= split_max_attempts; attempt++)); do
                    log_path="${log_dir}/${function_slug}-${device_slug}-${kind}-${index}-attempt-${attempt}.log"
                    rm -rf "${output_dir}" "${fetch_output_dir}"
                    mkdir -p "${output_dir}" "${fetch_output_dir}"
                    awk -v timeout="${function_android_timeout_secs}" -v heartbeat="10" '
                      /^android_benchmark_timeout_secs[[:space:]]*=/ { print "android_benchmark_timeout_secs = " timeout; next }
                      /^android_heartbeat_interval_secs[[:space:]]*=/ { print "android_heartbeat_interval_secs = " heartbeat; next }
                      { print }
                    ' mobench.toml > mobench.ci.toml
                    mv mobench.ci.toml mobench.toml

                    echo "mobench android split ${kind} ${index} attempt ${attempt}/${split_max_attempts}: ${benchmark_function} on ${android_device}"
                    set +e
                    MOBENCH_ANDROID_BENCHMARK_TIMEOUT_SECS="${function_android_timeout_secs}" \
                    MOBENCH_ANDROID_HEARTBEAT_INTERVAL_SECS="10" \
                    cargo-mobench ci run \
                      --target android \
                      --function "${benchmark_function}" \
                      --iterations 1 \
                      --warmup 0 \
                      --devices "${android_device}" \
                      --crate-path "$CRATE_PATH" \
                      $RELEASE_FLAG \
                      --android-benchmark-timeout-secs "${function_android_timeout_secs}" \
                      --android-heartbeat-interval-secs 10 \
                      --fetch \
                      --fetch-timeout-secs "${function_fetch_timeout_secs}" \
                      --fetch-output-dir "${fetch_output_dir}" \
                      --output-dir "${output_dir}" \
                      2>&1 | tee "$log_path"
                    status=${PIPESTATUS[0]}
                    set -e
                    cp "$log_path" "${output_dir}/attempt-${attempt}.log"
                    if [ "$status" -eq 0 ]; then
                      return 0
                    fi
                    if [ "$attempt" -ge "$split_max_attempts" ] || ! is_transient_fetch_failure "$log_path"; then
                      write_android_failure "${result_output_dir}" "$log_path" "${fetch_output_dir}" "${benchmark_function}" "${android_device}" "${function_iterations}" "${function_warmup}" "${function_max_attempts}" "${function_fetch_timeout_secs}"
                      return "$status"
                    fi
                    build_id="$(grep -Eo 'Build ID: [a-f0-9]+' "$log_path" | awk '{print $3}' | tail -1 || true)"
                    if [[ -n "$build_id" ]]; then
                      echo "::warning::Transient BrowserStack fetch failure for split Android build ${build_id}; retrying ${benchmark_function} on ${android_device} (${kind} ${index}, attempt ${attempt}/${split_max_attempts})"
                    else
                      echo "::warning::Transient BrowserStack fetch failure for split Android benchmark; retrying ${benchmark_function} on ${android_device} (${kind} ${index}, attempt ${attempt}/${split_max_attempts})"
                    fi
                    sleep $((attempt * 15))
                  done
                }

                for ((warmup_index = 1; warmup_index <= function_warmup; warmup_index++)); do
                  if ! run_split_invocation "warmup" "${warmup_index}" "${warmup_output_base}/warmup-${warmup_index}" "target/browserstack/android-warmup/${function_slug}/${device_slug}/warmup-${warmup_index}"; then
                    split_failed="true"
                    break
                  fi
                done

                if [[ "${split_failed}" != "true" ]]; then
                  for ((sample_index = 1; sample_index <= function_iterations; sample_index++)); do
                    if ! run_split_invocation "sample" "${sample_index}" "${split_output_dir}/sample-${sample_index}" "target/browserstack/android/${function_slug}/${device_slug}/sample-${sample_index}"; then
                      split_failed="true"
                      break
                    fi
                  done
                fi

                if [[ "${split_failed}" == "true" ]]; then
                  failure_count=$((failure_count + 1))
                  continue
                fi

                cargo-mobench ci merge-split-runs \
                  --samples-dir "${split_output_dir}" \
                  --output-dir "${result_output_dir}" \
                  --function "${benchmark_function}" \
                  --device "${android_device}" \
                  --iterations "${function_iterations}" \
                  --warmup "${function_warmup}"
                continue
              fi

              attempt=1
              while true; do
                attempt_log="${log_dir}/${function_slug}-${device_slug}-attempt-${attempt}.log"
                fetch_output_dir="target/browserstack/android/${function_slug}/${device_slug}"
                result_output_dir="target/mobench/ci/android/${function_slug}/${device_slug}"
                rm -rf "${fetch_output_dir}"
                mkdir -p "${fetch_output_dir}" "${result_output_dir}"
                awk -v timeout="${function_android_timeout_secs}" -v heartbeat="10" '
                  /^android_benchmark_timeout_secs[[:space:]]*=/ { print "android_benchmark_timeout_secs = " timeout; next }
                  /^android_heartbeat_interval_secs[[:space:]]*=/ { print "android_heartbeat_interval_secs = " heartbeat; next }
                  { print }
                ' mobench.toml > mobench.ci.toml
                mv mobench.ci.toml mobench.toml

                echo "mobench android ${benchmark_function} on ${android_device} attempt ${attempt}/${function_max_attempts}"
                set +e
                MOBENCH_ANDROID_BENCHMARK_TIMEOUT_SECS="${function_android_timeout_secs}" \
                MOBENCH_ANDROID_HEARTBEAT_INTERVAL_SECS="10" \
                cargo-mobench ci run \
                  --target android \
                  --function "${benchmark_function}" \
                  --iterations "${function_iterations}" \
                  --warmup "${function_warmup}" \
                  --devices "${android_device}" \
                  --crate-path "$CRATE_PATH" \
                  $RELEASE_FLAG \
                  --android-benchmark-timeout-secs "${function_android_timeout_secs}" \
                  --android-heartbeat-interval-secs 10 \
                  --fetch \
                  --fetch-timeout-secs "${function_fetch_timeout_secs}" \
                  --fetch-output-dir "${fetch_output_dir}" \
                  --output-dir "${result_output_dir}" \
                  2>&1 | tee "$attempt_log"
                status=${PIPESTATUS[0]}
                set -e
                cp "$attempt_log" "${result_output_dir}/attempt-${attempt}.log"

                if [ "$status" -eq 0 ]; then
                  break
                fi

                if [ "$attempt" -ge "$function_max_attempts" ] && grep -Eiq 'No benchmark results found|Timeout waiting for build|Build .* failed with status: failed' "$attempt_log"; then
                  echo "::warning::Android ${benchmark_function} did not return benchmark results on ${android_device}; preserving partial fixture results"
                  failure_count=$((failure_count + 1))
                  build_id="$(grep -Eo 'Build ID: [a-f0-9]+' "$attempt_log" | awk '{print $3}' | tail -1 || true)"
                  waited_secs="$(grep -Eo 'waited [0-9]+ seconds' "$attempt_log" | awk '{print $2}' | tail -1 || true)"
                  if [[ -z "${waited_secs}" ]]; then
                    waited_secs="${function_fetch_timeout_secs}"
                  fi
                  kill_evidence="$(
                    {
                      grep -Eih 'lowmemorykiller|low memory|Process .* was killed|Process .* killed|oom_reaper|SIGKILL|signal [0-9]+|out of memory|lmk' "$attempt_log" 2>/dev/null || true
                      find "${fetch_output_dir}" -type f -name '*.log' -exec grep -Eih 'lowmemorykiller|low memory|Process .* was killed|Process .* killed|oom_reaper|SIGKILL|signal [0-9]+|out of memory|lmk' {} + 2>/dev/null || true
                    } | tail -5 | tr '\n' ' '
                  )"
                  if [[ -n "${kill_evidence}" ]]; then
                    failure_reason="Android benchmark process reported an abnormal kill before results were fetched after ${waited_secs}s: ${kill_evidence}"
                  else
                    failure_reason="Android benchmark process produced no summary.json before the ${waited_secs}s BrowserStack fetch timeout; likely app/process death or watchdog timeout. Check BrowserStack build logs for LMK/OOM/SIGKILL evidence."
                  fi
                  {
                    echo "### Android fixture incomplete"
                    echo ""
                    echo "- Function: \`${benchmark_function}\`"
                    echo "- Device: \`${android_device}\`"
                    echo "- Iterations/Warmup: \`${function_iterations} / ${function_warmup}\`"
                    echo "- Fetch timeout: \`${waited_secs}s\`"
                    if [[ -n "${build_id}" ]]; then
                      echo "- BrowserStack build: \`${build_id}\`"
                    fi
                    echo "- Reason: ${failure_reason}"
                  } > "${result_output_dir}/failure.md"
                  jq -n \
                    --arg platform "android" \
                    --arg function "${benchmark_function}" \
                    --arg devices "${android_device}" \
                    --arg attempts "${function_max_attempts}" \
                    --arg fetch_timeout_secs "${waited_secs}" \
                    --arg build_id "${build_id}" \
                    --arg reason "${failure_reason}" \
                    --arg kill_evidence "${kill_evidence}" \
                    '{
                      platform: $platform,
                      function: $function,
                      devices: $devices,
                      attempts: ($attempts | tonumber),
                      fetch_timeout_secs: ($fetch_timeout_secs | tonumber),
                      build_id: (if $build_id == "" then null else $build_id end),
                      reason: $reason,
                      kill_evidence: (if $kill_evidence == "" then null else $kill_evidence end)
                    }' \
                    > "${result_output_dir}/failure.json"
                  break
                fi

                if [ "$attempt" -ge "$function_max_attempts" ] || ! is_transient_fetch_failure "$attempt_log"; then
                  exit "$status"
                fi

                build_id="$(grep -Eo 'Build ID: [a-f0-9]+' "$attempt_log" | awk '{print $3}' | tail -1 || true)"
                if [[ -n "$build_id" ]]; then
                  echo "::warning::Transient BrowserStack fetch failure for Android build ${build_id}; retrying ${benchmark_function} on ${android_device}"
                else
                  echo "::warning::Transient BrowserStack fetch failure for Android; retrying ${benchmark_function} on ${android_device}"
                fi

                attempt=$((attempt + 1))
                sleep "$retry_sleep_secs"
              done
            done
          done

          if [ "${failure_count}" -gt 0 ]; then
            echo "::error::Android benchmark completed with ${failure_count} fixture failure(s)."
            exit 1
          fi

      - name: Upload Android results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobench-results-android
          path: |
            caller/target/mobench/ci/android/**
            caller/target/browserstack/android/**
            caller/target/mobench/retry-logs/android/**
          if-no-files-found: warn

  summarize:
    name: Summarize benchmark results
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          path: caller
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc -Vv
          cargo -V

      - name: Install mobench
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${MOBENCH_REF}" ]]; then
            echo "Installing mobench from ${MOBENCH_REF}"
            git clone https://github.com/worldcoin/mobile-bench-rs mobench-src
            git -C mobench-src fetch --depth 1 origin "${MOBENCH_REF}"
            git -C mobench-src checkout FETCH_HEAD
            cargo install --path mobench-src/crates/mobench --locked --force
          else
            echo "Installing mobench ${MOBENCH_VERSION} from crates.io"
            cargo install mobench --version "${MOBENCH_VERSION}" --locked --force
          fi
          cargo-mobench --version

      - name: Download iOS results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mobench-results-ios
          path: results/ios

      - name: Download Android results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mobench-results-android
          path: results/android

      - name: Merge split iOS shard results
        if: always()
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
        run: |
          set -euo pipefail
          if [ ! -d "results/ios/mobench/ci/ios" ]; then
            exit 0
          fi

          while IFS= read -r -d '' split_dir; do
            result_output_dir="$(dirname "${split_dir}")"
            sample_count=$(find "${split_dir}" -mindepth 1 -maxdepth 1 -type d -name 'sample-*' | wc -l | tr -d ' ')
            if [ "${sample_count}" -eq 0 ]; then
              continue
            fi

            first_summary="$(find "${split_dir}" -mindepth 2 -maxdepth 2 -type f -name summary.json | sort | head -1)"
            if [[ -z "${first_summary}" ]]; then
              continue
            fi
            function="$(jq -r '.summary.device_summaries[0].benchmarks[0].function' "${first_summary}")"
            device="$(jq -r '.summary.device_summaries[0].device' "${first_summary}")"

            cargo-mobench ci merge-split-runs \
              --samples-dir "${split_dir}" \
              --output-dir "${result_output_dir}" \
              --function "${function}" \
              --device "${device}" \
              --iterations "${ITERATIONS}" \
              --warmup "${WARMUP}"
          done < <(find results/ios/mobench/ci/ios -type d -name split -print0)

      - name: Setup Python for plot rendering
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plot rendering dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy

      - name: Render plot-capable platform summaries
        id: render_summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          rendered_count=0

          render_platform_summary() {
            local platform="$1"
            local results_dir="results/${platform}"
            if [ ! -d "${results_dir}" ]; then
              return 0
            fi

            local summary_count
            summary_count=$(find "${results_dir}" -type f -name summary.json | wc -l | tr -d ' ')
            if [ "${summary_count}" -eq 0 ]; then
              echo "::warning::No ${platform} summary.json found under ${results_dir}"
              return 0
            fi

            local csv_count
            csv_count=$(find "${results_dir}" -type f -name results.csv | wc -l | tr -d ' ')
            if [ "${csv_count}" -eq 0 ]; then
              echo "::warning::No ${platform} results.csv found under ${results_dir}"
              return 0
            fi

            mkdir -p "rendered/${platform}"
            cargo-mobench ci summarize \
              --results-dir "${results_dir}" \
              --output-format markdown \
              --output-file "rendered/${platform}/summary.md"

            while IFS= read -r failure_md; do
              {
                echo ""
                cat "${failure_md}"
              } >> "rendered/${platform}/summary.md"
            done < <(find "${results_dir}" -type f -name failure.md | sort)
          }

          for platform in ios android; do
            if render_platform_summary "${platform}" && [ -f "rendered/${platform}/summary.md" ]; then
              rendered_count=$((rendered_count + 1))
            fi
          done

          if [ "${rendered_count}" -eq 0 ]; then
            echo "::warning::No benchmark summaries were rendered."
          fi

          echo "rendered_count=${rendered_count}" >> "$GITHUB_OUTPUT"

      - name: Render platform Sina plots
        if: steps.render_summaries.outputs.rendered_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import math
          import re
          from collections import defaultdict
          from pathlib import Path

          import matplotlib.pyplot as plt
          import numpy as np

          FUNCTION_LABELS = {
              "bench_mobile::bench_oprf_prove": "OPRF",
              "bench_mobile::bench_passport_fragmented_age_check_prove": "Fragmented age",
              "bench_mobile::bench_passport_complete_age_check_prove": "Monolithic age",
          }
          FUNCTION_COLORS = {
              "OPRF": "#2f80ed",
              "Fragmented age": "#27ae60",
              "Monolithic age": "#eb5757",
          }

          def report_function(report):
              name = report.get("function") or report.get("spec", {}).get("name") or "benchmark"
              return FUNCTION_LABELS.get(name, name.rsplit("::", 1)[-1])

          def android_device_from_path(report_path):
              parts = report_path.parts
              try:
                  idx = parts.index("android")
                  device_slug = parts[idx + 2]
              except (ValueError, IndexError):
                  return "Android"
              device_slug = re.sub(r"_\d+_\d+$", "", device_slug)
              return device_slug.replace("_", " ")

          def ios_session_devices(build_json_path):
              try:
                  build = json.loads(build_json_path.read_text())
              except (OSError, json.JSONDecodeError):
                  return {}

              mapping = {}
              for device in build.get("devices", []):
                  label = device.get("device") or "iPhone"
                  for session in device.get("sessions", []):
                      session_id = session.get("id")
                      if session_id:
                          mapping[session_id] = label
              return mapping

          def ios_device_from_path(report_path, cache):
              session_dir = report_path.parent
              session_id = session_dir.name.removeprefix("session-")
              build_dir = session_dir.parent
              build_json_path = build_dir / "build.json"
              if build_json_path not in cache:
                  cache[build_json_path] = ios_session_devices(build_json_path)
              return cache[build_json_path].get(session_id, "iPhone")

          def sample_points(platform):
              root = Path("results") / platform / "browserstack" / platform
              if not root.exists():
                  return []

              points = []
              ios_build_cache = {}
              for report_path in sorted(root.rglob("bench-report.json")):
                  try:
                      report = json.loads(report_path.read_text())
                  except (OSError, json.JSONDecodeError):
                      continue

                  function = report_function(report)
                  if platform == "ios":
                      device = ios_device_from_path(report_path, ios_build_cache)
                  else:
                      device = android_device_from_path(report_path)

                  samples = report.get("samples") or []
                  if not samples and report.get("samples_ns"):
                      samples = [{"duration_ns": duration_ns} for duration_ns in report["samples_ns"]]

                  for index, sample in enumerate(samples):
                      duration_ns = sample.get("duration_ns")
                      if duration_ns is None and index < len(report.get("samples_ns", [])):
                          duration_ns = report["samples_ns"][index]
                      if duration_ns is None:
                          continue

                      memory_kb = sample.get("process_peak_memory_kb")
                      if memory_kb is None:
                          memory_kb = sample.get("peak_memory_kb")

                      points.append(
                          {
                              "device": device,
                              "function": function,
                              "duration_s": duration_ns / 1_000_000_000.0,
                              "memory_mb": None if memory_kb is None else memory_kb / 1024.0,
                          }
                      )
              return points

          def sina_offsets(values, max_width=0.32):
              if len(values) <= 1:
                  return np.zeros(len(values))

              values = np.asarray(values, dtype=float)
              finite = values[np.isfinite(values)]
              if len(finite) <= 1 or float(np.nanmax(finite) - np.nanmin(finite)) == 0.0:
                  widths = np.full(len(values), max_width * 0.45)
              else:
                  bins = min(24, max(6, int(math.sqrt(len(finite)) * 2)))
                  counts, edges = np.histogram(finite, bins=bins)
                  max_count = max(int(counts.max()), 1)
                  bin_index = np.clip(np.searchsorted(edges, values, side="right") - 1, 0, len(counts) - 1)
                  widths = np.array([(counts[i] / max_count) * max_width for i in bin_index], dtype=float)

              rng = np.random.default_rng(42)
              return rng.uniform(-widths, widths)

          def device_sort_key(device):
              known_order = [
                  "iPhone 7",
                  "iPhone SE",
                  "iPhone 11",
                  "iPhone 13",
                  "iPhone 14",
                  "iPhone 15",
                  "iPhone 16",
                  "iPhone 17",
                  "Samsung Galaxy M32",
                  "Google Pixel 7",
                  "Samsung Galaxy S24",
              ]
              for index, prefix in enumerate(known_order):
                  if device.startswith(prefix):
                      return (index, device)
              return (len(known_order), device)

          def draw_axis(ax, grouped, categories, metric, ylabel):
              for xpos, category in enumerate(categories):
                  records = grouped[category]
                  values = [record[metric] for record in records if record[metric] is not None]
                  if not values:
                      continue

                  offsets = sina_offsets(values)
                  colors = [FUNCTION_COLORS.get(record["function"], "#555555") for record in records if record[metric] is not None]
                  ax.scatter(
                      xpos + offsets,
                      values,
                      s=24,
                      c=colors,
                      alpha=0.62,
                      edgecolors="white",
                      linewidths=0.35,
                      zorder=3,
                  )
                  median = float(np.median(values))
                  ax.plot([xpos - 0.22, xpos + 0.22], [median, median], color="#111111", linewidth=1.6, zorder=4)

              ax.set_ylabel(ylabel)
              ax.grid(axis="y", color="#d9dee7", linewidth=0.8)
              ax.set_axisbelow(True)

          def render_platform(platform, title):
              points = sample_points(platform)
              if not points:
                  return

              grouped = defaultdict(list)
              for point in points:
                  grouped[(point["device"], point["function"])].append(point)

              devices = sorted({point["device"] for point in points}, key=device_sort_key)
              functions = [label for label in FUNCTION_LABELS.values() if label in {point["function"] for point in points}]
              functions += sorted({point["function"] for point in points} - set(functions))
              categories = [(device, function) for device in devices for function in functions if (device, function) in grouped]

              output_dir = Path("rendered") / platform / "plots"
              output_dir.mkdir(parents=True, exist_ok=True)

              width = max(10.0, len(categories) * 0.95)
              fig, axes = plt.subplots(2, 1, figsize=(width, 9.5), sharex=True, constrained_layout=True)
              fig.suptitle(title, fontsize=16, fontweight="bold")

              draw_axis(axes[0], grouped, categories, "duration_s", "Prove time (s)")
              draw_axis(axes[1], grouped, categories, "memory_mb", "Process peak memory (MB)")

              labels = [f"{device}\n{function}" for device, function in categories]
              axes[1].set_xticks(range(len(categories)), labels, rotation=35, ha="right")

              handles = [
                  plt.Line2D([0], [0], marker="o", color="w", label=label, markerfacecolor=color, markersize=8)
                  for label, color in FUNCTION_COLORS.items()
                  if any(point["function"] == label for point in points)
              ]
              axes[0].legend(handles=handles, loc="upper right", frameon=False)

              for ax in axes:
                  for spine in ("top", "right"):
                      ax.spines[spine].set_visible(False)

              fig.savefig(output_dir / f"{platform}-sina.svg", format="svg")
              plt.close(fig)

          render_platform("ios", "iPhone ProveKit benchmark distributions")
          render_platform("android", "Android ProveKit benchmark distributions")
          PY

      - name: Publish plot assets
        id: publish_plots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASSET_BRANCH: mobench-plots
        run: |
          set -euo pipefail

          if ! find rendered -type f -path "*/plots/*.svg" | grep -q .; then
            echo "base_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          asset_path="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          publish_root="$(mktemp -d)"

          if git clone --quiet --branch "${ASSET_BRANCH}" "${remote}" "${publish_root}" 2>/dev/null; then
            :
          else
            git clone --quiet "${remote}" "${publish_root}"
            git -C "${publish_root}" checkout --orphan "${ASSET_BRANCH}"
            git -C "${publish_root}" rm -rf . >/dev/null 2>&1 || true
          fi

          git -C "${publish_root}" config user.name "github-actions[bot]"
          git -C "${publish_root}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "${publish_root}/${asset_path}"

          for platform in ios android; do
            if [ -d "rendered/${platform}/plots" ]; then
              mkdir -p "${publish_root}/${asset_path}/${platform}"
              rm -rf "${publish_root}/${asset_path}/${platform}/plots"
              cp -R "rendered/${platform}/plots" "${publish_root}/${asset_path}/${platform}/plots"
            fi
          done

          git -C "${publish_root}" add "${asset_path}"
          if ! git -C "${publish_root}" diff --cached --quiet; then
            git -C "${publish_root}" commit -m "mobench plots for run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null
            git -C "${publish_root}" push origin "${ASSET_BRANCH}" >/dev/null
          fi

          echo "base_url=https://raw.githubusercontent.com/${REPO}/${ASSET_BRANCH}/${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Rewrite platform summaries for GitHub markdown
        shell: bash
        env:
          PLOT_BASE_URL: ${{ steps.publish_plots.outputs.base_url }}
        run: |
          set -euo pipefail

          rewrite_platform_summary() {
            local platform="$1"
            local input="rendered/${platform}/summary.md"
            local output="rendered/${platform}/github-summary.md"
            if [ ! -f "${input}" ]; then
              return 0
            fi

            cp "${input}" "${output}"
            if [ -n "${PLOT_BASE_URL:-}" ] && [ -d "rendered/${platform}/plots" ]; then
              sed -i "s#](plots/#](${PLOT_BASE_URL}/${platform}/plots/#g" "${output}"
              {
                echo ""
                echo "### ${platform^} Sina Plot"
                echo ""
                echo "![${platform} Sina plot](${PLOT_BASE_URL}/${platform}/plots/${platform}-sina.svg)"
              } >> "${output}"
            fi
          }

          rewrite_platform_summary ios
          rewrite_platform_summary android

      - name: Post sticky PR comment
        if: inputs.pr_number != '' && steps.render_summaries.outputs.rendered_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ inputs.report_repository != '' && inputs.report_repository || github.repository }}
        run: |
          set -euo pipefail
          MARKER="<!-- mobench-summary -->"
          BODY="${MARKER}
          ## Mobench Benchmark Results

          "

          for platform in ios android; do
            PLATFORM_MD_FILE="rendered/${platform}/github-summary.md"
            if [ -f "${PLATFORM_MD_FILE}" ]; then
              PLATFORM_MD=$(cat "${PLATFORM_MD_FILE}")
              BODY="${BODY}${PLATFORM_MD}

          "
            fi
          done

          BODY="${BODY}
          ---
          *Posted by [mobench](https://github.com/worldcoin/mobile-bench-rs) at $(date -u '+%Y-%m-%d %H:%M UTC')*"

          comments_json="$(mktemp)"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" > "${comments_json}"; then
            EXISTING_COMMENT_ID=$(jq -r --arg marker "${MARKER}" '.[] | select(.body | contains($marker)) | .id' "${comments_json}" | head -1)
          else
            echo "::warning::Unable to list comments for ${REPO}#${PR_NUMBER}; skipping sticky benchmark comment."
            exit 0
          fi

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -X PATCH \
              -f body="${BODY}" \
              --silent || echo "::warning::Unable to update sticky benchmark comment ${EXISTING_COMMENT_ID} in ${REPO}."
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}" \
              --silent || echo "::warning::Unable to create sticky benchmark comment in ${REPO}#${PR_NUMBER}."
          fi
