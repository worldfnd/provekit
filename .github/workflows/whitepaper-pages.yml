name: Publish whitepaper pages

on:
  push:
    branches:
      - feature/whitepaper
    paths:
      - '.github/workflows/whitepaper-pages.yml'
      - 'docs/**'
      - 'whitepaper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4.0.5

      - name: Compile whitepaper PDF
        run: |
          mkdir -p assets/whitepaper
          tectonic -X compile --outdir assets/whitepaper --outfmt pdf --untrusted whitepaper/main.tex
          mv assets/whitepaper/main.pdf assets/whitepaper/provekit-v2-whitepaper.pdf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Check documentation
        working-directory: docs
        run: pnpm check

      - name: Build documentation
        working-directory: docs
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
