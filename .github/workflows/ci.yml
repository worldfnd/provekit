name: Cargo Build & Test

on:
  push:
    branches: [main, v1]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# When a new job is pushed on a PR, cancel the old one.
concurrency:
  group: >
    ci-${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.event.pull_request.number)
        || format('push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: build, clippy, and doc each run on a dedicated runner. They share no
  # disk, so the `--all-targets --all-features` target dir is not accumulated
  # across steps. A single combined job runs out of disk on the ARM runner now
  # that the workspace includes `provekit-wasm` and its dependency tree.
  build_and_test:
    name: Build and test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk before build and tests
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h
      - name: Setup rust toolchain, cache and bins
        uses: moonrepo/setup-rust@v1
        with:
          channel: nightly-2026-03-04
          cache-base: main
      - name: Setup Noir
        uses: noir-lang/noirup@v0.1.2
        with:
          toolchain: v1.0.0-beta.26
      - name: Generate mobile benchmark Noir artifacts
        run: bench-mobile/scripts/generate-fixtures.sh
        env:
          MOBENCH_CI_PREPARE: "1"
      - run: cargo build --all-targets --all-features
      - run: cargo test --no-fail-fast --all-features --lib --tests --bins -- --nocapture
        env:
          RUST_BACKTRACE: 1
      - run: cargo test --doc --all-features

  cargo_clippy:
    name: Clippy
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain, cache and bins
        uses: moonrepo/setup-rust@v1
        with:
          channel: nightly-2026-03-04
          cache-base: main
          components: clippy
      - run: cargo clippy --all-targets --all-features --verbose

  cargo_fmt:
    name: Cargo fmt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain, cache and bins
        uses: moonrepo/setup-rust@v1
        with:
          channel: nightly-2026-03-04
          cache-base: main
          components: rustfmt
      - run: cargo fmt --all --check

  cargo_doc:
    name: Documentation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain, cache and bins
        uses: moonrepo/setup-rust@v1
        with:
          channel: nightly-2026-03-04
          cache-base: main
      - run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg doc_cfg -D warnings"
