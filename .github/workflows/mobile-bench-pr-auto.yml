name: Mobile Bench PR Auto

on:
  push:
    branches:
      - dcbuild3r/mobench-v1-browserstack
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: ["Cargo Build & Test"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  resolve:
    name: Check compile gate and resolve context
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should_run: ${{ steps.pr.outputs.should_run }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      requested_by: ${{ steps.pr.outputs.requested_by }}
      platform: ${{ steps.pr.outputs.platform }}
      iterations: ${{ steps.pr.outputs.iterations }}
      warmup: ${{ steps.pr.outputs.warmup }}
    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
          BASE_REF_PR: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA_WR: ${{ github.event.workflow_run.head_sha }}
          HEAD_SHA_PUSH: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ITERATIONS="2"
          WARMUP="1"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$PR_NUMBER_EVENT"
            HEAD_SHA="$HEAD_SHA_PR"
            REQUESTED_BY="auto:pull_request"
            PLATFORM="both"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            pr_json=$(gh api "repos/${REPO}/pulls?state=open&sort=updated&direction=desc&per_page=50" \
              --jq ".[] | select(.head.sha == \"${HEAD_SHA_WR}\") | {number, base_ref: .base.ref}" \
              | head -1)
            if [ -z "$pr_json" ]; then
              echo "::notice::No open PR found for SHA ${HEAD_SHA_WR}, skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            PR_NUMBER=$(jq -r '.number' <<<"$pr_json")
            HEAD_SHA="$HEAD_SHA_WR"
            REQUESTED_BY="auto:workflow_run"
            PLATFORM="both"
          else
            case "$HEAD_COMMIT_MESSAGE" in
              *"[mobench:android:100]"*) PLATFORM="android"; ITERATIONS="100"; WARMUP="10" ;;
              *"[mobench:ios:100]"*) PLATFORM="ios"; ITERATIONS="100"; WARMUP="10" ;;
              *"[mobench:both:100]"*|*"[mobench:100]"*) PLATFORM="both"; ITERATIONS="100"; WARMUP="10" ;;
              *"[mobench:android]"*) PLATFORM="android" ;;
              *"[mobench:ios]"*) PLATFORM="ios" ;;
              *"[mobench:both]"*) PLATFORM="both" ;;
              *)
                echo "::notice::Push does not include a mobench platform marker, skipping"
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            pr_json=$(gh api "repos/${REPO}/pulls?state=open&sort=updated&direction=desc&per_page=50" \
              --jq ".[] | select(.head.sha == \"${HEAD_SHA_PUSH}\") | {number, base_ref: .base.ref}" \
              | head -1)
            if [ -z "$pr_json" ]; then
              echo "::notice::No open PR found for SHA ${HEAD_SHA_PUSH}, skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            PR_NUMBER=$(jq -r '.number' <<<"$pr_json")
            HEAD_SHA="$HEAD_SHA_PUSH"
            REQUESTED_BY="auto:push"
          fi

          has_label=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            --jq '.[].name' | grep -qx 'bench' && echo "true" || echo "false")
          if [ "$has_label" != "true" ]; then
            echo "::notice::PR #${PR_NUMBER} does not have 'bench' label, skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] || [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            gate_status="success"
          else
            gate_status=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '.check_runs[] | select((.name == "Build & Test (all features)" or .name == "Build and test" or .name == "Cargo Build & Test") and .conclusion == "success") | .conclusion' \
              | head -1)
          fi
          if [ "$gate_status" != "success" ]; then
            echo "::notice::Compile gate 'Cargo Build & Test' not yet passed for ${HEAD_SHA} (status: ${gate_status:-pending})"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "requested_by=${REQUESTED_BY}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"
          echo "iterations=${ITERATIONS}" >> "$GITHUB_OUTPUT"
          echo "warmup=${WARMUP}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  browserstack:
    name: Run BrowserStack benchmarks
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    uses: ./.github/workflows/mobile-bench-reusable.yml
    secrets: inherit
    with:
      crate_path: ./bench-mobile
      functions: '["bench_mobile::bench_passport_complete_age_check_prove","bench_mobile::bench_passport_fragmented_age_check_prove","bench_mobile::bench_oprf_prove"]'
      functions_ios: '["bench_mobile::bench_passport_complete_age_check_prove","bench_mobile::bench_passport_fragmented_age_check_prove","bench_mobile::bench_oprf_prove"]'
      functions_android: '["bench_mobile::bench_oprf_prove","bench_mobile::bench_passport_fragmented_age_check_prove","bench_mobile::bench_passport_complete_age_check_prove"]'
      platform: ${{ needs.resolve.outputs.platform }}
      device_profile: triad
      device_profile_android: triad
      iterations: ${{ needs.resolve.outputs.iterations }}
      warmup: ${{ needs.resolve.outputs.warmup }}
      mobench_version: "0.1.41"
      mobench_ref: "8c3f002ae515afaa7440107f4e671f7067d276e3"
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      requested_by: ${{ needs.resolve.outputs.requested_by }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
