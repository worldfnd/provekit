name: Mobench PR 450/451 E2E Dispatcher

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "ProveKit PR number"
        required: true
        type: string
      head_sha:
        description: "Exact 40-character PR head SHA"
        required: true
        type: string
      platform:
        description: "android | ios | both"
        required: false
        default: both
        type: choice
        options:
          - android
          - ios
          - both
      functions_ios:
        description: "iOS benchmark functions"
        required: false
        default: '["bench_mobile::bench_passport_complete_age_check_prove","bench_mobile::bench_passport_fragmented_age_check_prove","bench_mobile::bench_oprf_prove"]'
        type: string
      functions_android:
        description: "Android benchmark functions"
        required: false
        default: '["bench_mobile::bench_passport_complete_age_check_prove","bench_mobile::bench_passport_fragmented_age_check_prove","bench_mobile::bench_oprf_prove"]'
        type: string
      ios_devices:
        description: "iOS device matrix JSON"
        required: false
        default: '[{"device":"iPhone SE 2022","os_version":"15"},{"device":"iPhone 14","os_version":"16"},{"device":"iPhone 16 Pro Max","os_version":"18"}]'
        type: string
      android_devices:
        description: "Android device matrix JSON"
        required: false
        default: '[{"device":"Samsung Galaxy S24","os_version":"14.0"},{"device":"Google Pixel 7","os_version":"13.0"},{"device":"Samsung Galaxy M32","os_version":"11.0"}]'
        type: string

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

jobs:
  browserstack:
    name: BrowserStack triad benchmarks
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write
    uses: worldcoin/mobile-bench-rs/.github/workflows/reusable-bench.yml@pr-450-451
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    with:
      crate_path: ./bench-mobile
      functions: '["bench_mobile::bench_passport_complete_age_check_prove","bench_mobile::bench_passport_fragmented_age_check_prove","bench_mobile::bench_oprf_prove"]'
      functions_ios: ${{ inputs.functions_ios }}
      functions_android: ${{ inputs.functions_android }}
      prepare_script: bench-mobile/scripts/generate-fixtures.sh
      platform: ${{ inputs.platform }}
      device_profile: custom
      ios_devices: ${{ inputs.ios_devices }}
      android_devices: ${{ inputs.android_devices }}
      iterations: "2"
      warmup: "1"
      mobench_ref: pr-450-451
      max_completion_timeout_secs: 7200
      rust_toolchain: nightly-2026-03-04
      ffi_backend: native-c-abi
      pr_number: ${{ inputs.pr_number }}
      allow_non_pr: false
      requested_by: ${{ github.actor }}
      head_sha: ${{ inputs.head_sha }}
