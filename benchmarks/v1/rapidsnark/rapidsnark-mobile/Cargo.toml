[package]
name = "provekit-v1-rapidsnark-mobile"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[features]
default = ["passport-disclose"]
passport-register = []
passport-disclose = []
passport-p1 = []

[dependencies]
anyhow = "1"
inventory = "0.3"
mobench-sdk = { git = "https://github.com/worldcoin/mobile-bench-rs.git", rev = "e992596a786cc18047102a318d40131c953e57b8" }
uniffi = { version = "0.31", features = ["cli"] }
num-bigint = "0.4"
rust-witness = "=0.1.6"
serde_json = "1"

[build-dependencies]
cc = "1"
chkstk_stub = "=0.1.0"
rust-witness = "=0.1.6"

[workspace]
