[package]
name = "provekit-v1-rapidsnark-mobile-register"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
build = "../rapidsnark-mobile/build.rs"

[lib]
path = "../rapidsnark-mobile/src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[features]
default = ["passport-register"]
passport-register = []
passport-disclose = []
passport-p1 = []

[dependencies]
anyhow = "1"
inventory = "0.3"
mobench-sdk = "0.2.0"
uniffi = { version = "0.31", features = ["cli"] }
num-bigint = "0.4"
rust-witness = "=0.1.6"
serde_json = "1"

[build-dependencies]
cc = "1"
chkstk_stub = "=0.1.0"
rust-witness = "=0.1.6"

[workspace]
