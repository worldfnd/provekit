[package]
name = "provekit-v1-rapidsnark-mobile-oprf"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
build = "../rapidsnark-mobile/build.rs"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[features]
default = ["oprf-query"]
oprf-query = []
oprf-nullifier = []

[dependencies]
anyhow = "1"
inventory = "0.3"
mobench-sdk = "0.2.0"
uniffi = { version = "0.31", features = ["cli"] }
num-bigint = "0.4"
serde_json = "1"
wasmi = "=0.46.0"

[build-dependencies]
cc = "1"
chkstk_stub = "=0.1.0"
rust-witness = "=0.1.6"

[workspace]
