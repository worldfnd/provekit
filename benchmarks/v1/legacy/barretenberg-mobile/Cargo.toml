[package]
name = "provekit-v1-barretenberg-mobile"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
build = "build.rs"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[features]
default = ["mobench", "native-v087"]
native-v087 = []
mobench = ["dep:inventory", "dep:mobench-sdk", "dep:uniffi"]

[dependencies]
anyhow = "1"
hex = "0.4"
inventory = { version = "0.3", optional = true }
mobench-sdk = { git = "https://github.com/worldcoin/mobile-bench-rs.git", rev = "e992596a786cc18047102a318d40131c953e57b8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uniffi = { version = "0.31", features = ["cli"], optional = true }

[workspace]
