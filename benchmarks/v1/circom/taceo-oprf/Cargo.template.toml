[package]
name = "taceo-oprf-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ark-bn254 = "0.6"
ark-serialize = "0.6"
libc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
ruint = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
taceo-groth16-material = { package = "taceo-groth16-material", path = "__HELPER_PATH__", features = ["circom"] }

[patch.crates-io]
circom-witness-rs = { git = "https://github.com/philsippl/circom-witness-rs.git", rev = "e11206a9f453145dcd6b814523cbfba4f60cf5c6" }
